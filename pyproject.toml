[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "orc-grace"
version = "0.1.0"
description = "GRACE Orchestrator"
requires-python = ">=3.11"

[project.scripts]
grace = "src.grace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

